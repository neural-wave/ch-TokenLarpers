name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check pvdetect/ train.py inference.py gui.py tests/

      - name: Hygiene check
        run: python scripts/check_hygiene.py --all

      - name: Test
        run: pytest -q -p no:cacheprovider --continue-on-collection-errors
